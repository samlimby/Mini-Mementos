 else if(state.page==='volume')s+=`<text class="lcd" x="116" y="65" text-anchor="middle" font-size="25">${Math.round(state.volume*100)}%</text><rect x="27" y="90" width="178" height="10" rx="3" fill="var(--bar)"/><rect x="27" y="90" width="${178*state.volume}" height="10" rx="3" fill="var(--blue)"/><text class="lcd lcd-muted" x="116" y="132" text-anchor="middle" font-size="10">Turn the click wheel to adjust.</text>`;
 else if(state.page==='about')s+=`<text class="lcd" x="13" y="45" font-size="14">iPod nano</text><text class="lcd lcd-muted" x="13" y="63" font-size="10">3rd generation · 2007</text><text class="lcd" x="13" y="90" font-size="11">Songs<tspan x="216" text-anchor="end">${tracks.length}</tspan></text><text class="lcd" x="13" y="109" font-size="11">Artist<tspan x="216" text-anchor="end">Small Hours</tspan></text><text class="lcd lcd-muted" x="13" y="142" font-size="9">An interactive tribute.</text><text class="lcd lcd-muted" x="13" y="157" font-size="9">Original synthesized demo music.</text>`;
 else s+=`<text class="lcd" x="116" y="86" text-anchor="middle" font-size="12">No ${state.page} synced.</text><text class="lcd lcd-muted" x="116" y="106" text-anchor="middle" font-size="10">Your music is ready to go.</text>`;
 $('screen').innerHTML=s;
 if(state.inspect)drawInspection();
 document.title=`${state.playing?'♫ ':''}${state.page==='now'?t.title+' — ':''}Fig-1 · Pocket music`;
}
function announce(){const m=currentMenu();$('announcement').textContent=m?`${m.title}, ${m.items[state.selected][0]}`:state.page==='now'?`${tracks[state.track].title}, ${state.playing?'playing':state.hasPlayed?'paused':'ready'}`:state.page;}
function navigate(page){state.stack.push({page:state.page,selected:state.selected});state.page=page;state.selected=0;state.mode='volume';state.last=page==='now'?tracks[state.track].title.toLowerCase():page;}
function back(){const prev=state.stack.pop();if(prev){state.page=prev.page;state.selected=prev.selected;}else{state.page='home';state.selected=0;}state.last='menu';}
function flash(action){const el=stage.querySelector(`[data-action="${action}"]`);if(!el)return;el.classList.add('down');setTimeout(()=>el.classList.remove('down'),110);}
let playbackRequest=0;
async function setPlaying(on,label){
 const request=++playbackRequest;
 if(!on){state.starting=false;if(window.NanoAudio){state.position=NanoAudio.getPosition();NanoAudio.pause();}state.playing=false;state.last='paused';render();return;}
 if(!window.NanoAudio?.supported){state.last='audio unavailable';render();return;}
 state.starting=true;state.last='starting audio';render();
 try{NanoAudio.setVolume(state.volume);await NanoAudio.play(state.track,state.position);if(request!==playbackRequest)return;state.playing=NanoAudio.isPlaying();state.hasPlayed=state.hasPlayed||state.playing;state.starting=false;state.last=state.playing?(label||tracks[state.track].title.toLowerCase()):'press s to play';}
 catch(e){state.starting=false;state.playing=false;state.last='press s to enable audio';console.warn('Audio could not start:',e.message);}render();announce();
}
function startTrack(i){state.track=(i+tracks.length)%tracks.length;state.position=0;state.mode='volume';if(state.page!=='now')navigate('now');state.last=tracks[state.track].title.toLowerCase();setPlaying(true);}
function shuffledTrack(){return tracks.length<2?0:(state.track+1+Math.floor(Math.random()*(tracks.length-1)))%tracks.length;}
function changeTrack(dir){if(dir<0&&state.position>3){seek(-state.position);state.last='track restarted';}else{state.track=state.shuffle&&dir>0?shuffledTrack():(state.track+dir+tracks.length)%tracks.length;state.position=0;if(state.playing)setPlaying(true);else if(window.NanoAudio)NanoAudio.pause();state.last=tracks[state.track].title.toLowerCase();}render();}
function seek(delta){state.position=Math.max(0,Math.min(tracks[state.track].duration-.1,state.position+delta));if(state.playing)setPlaying(true,`seek ${time(state.position)}`);state.last=`seek ${time(state.position)}`;render();}
function adjustVolume(delta){state.volume=Math.max(0,Math.min(1,state.volume+delta));window.NanoAudio?.setVolume(state.volume);state.overlay=Date.now()+1400;state.last=`volume ${Math.round(state.volume*100)}%`;}
function rotate(dir){
 const m=currentMenu();if(m){state.selected=Math.max(0,Math.min(m.items.length-1,state.selected+dir));state.last=m.items[state.selected][0].toLowerCase();}
 else if(state.page==='photos'){state.photo=(state.photo+dir+3)%3;state.last=`artwork ${state.photo+1} of 3`;}
 else if(state.page==='now'&&state.mode==='seek')seek(dir*5);
 else if(state.page==='now'||state.page==='volume')adjustVolume(dir*.04);
 render();announce();
}
function action(a){
 if(a==='inspect'){setInspection(!state.inspect);return;}
 if(state.inspect){if(a==='play')setPlaying(!(state.playing||state.starting));return;}
 if(a==='view'){toggleFacing();return;}
 flash(a);
 if(a==='up'||a==='down')rotate(a==='up'?-1:1);
 else if(a==='menu'||a==='back')back();
 else if(a==='play'){if(state.page!=='now')navigate('now');setPlaying(!(state.playing||state.starting));}
 else if(a==='next'||a==='previous')changeTrack(a==='next'?1:-1);
 else if(a==='select'){
  const m=currentMenu();if(m){const dest=m.items[state.selected][1];if(dest.startsWith('track:'))startTrack(Number(dest.split(':')[1]));else if(dest==='shuffle'){state.shuffle=true;startTrack(shuffledTrack());}else if(dest==='repeat'||dest==='shuffleSetting'){const key=dest==='shuffleSetting'?'shuffle':dest;state[key]=!state[key];state.last=`${key} ${state[key]?'on':'off'}`;}else navigate(dest);}
  else if(state.page==='now'){state.mode=state.mode==='volume'?'seek':'volume';state.overlay=Date.now()+1400;state.last=state.mode==='seek'?'wheel · seek':'wheel · volume';}
  else if(state.page==='photos'){state.photo=(state.photo+1)%3;state.last=`artwork ${state.photo+1} of 3`;}
  else back();
 }
 render();announce();
}
// The drag is measured in the wheel's unprojected plane, so a circular gesture
// remains accurate at any viewport size and anywhere on the isometric ellipse.
const wheelPlane=$('wheel-plane'),wheelArea=$('wheel-area');let drag=null,heldTimer=0,seekTimer=0;
function localPoint(e){return new DOMPoint(e.clientX,e.clientY).matrixTransform(wheelPlane.getScreenCTM().inverse());}
function clearHold(){clearTimeout(heldTimer);clearInterval(seekTimer);heldTimer=seekTimer=0;}
function beginHold(a,owner){if(state.hold)return;clearHold();state.hold={action:a,seeking:false,owner};heldTimer=setTimeout(()=>{if(!state.hold)return;state.hold.seeking=true;state.page==='now'||navigate('now');state.mode='seek';seek(a==='next'?5:-5);seekTimer=setInterval(()=>seek(a==='next'?5:-5),240);},420);}
function releaseHold(cancel=false,owner){const h=state.hold;if(owner&&h?.owner!==owner)return;clearHold();state.hold=null;if(h&&!h.seeking&&!cancel)action(h.action);}
stage.addEventListener('pointerdown',e=>{
 if(state.inspect||e.button!==0)return;const target=e.target.closest('[data-action]'),row=e.target.closest('[data-index]');
 if(row){state.selected=Number(row.dataset.index);action('select');e.preventDefault();return;}
 if(!e.target.closest('#device'))return;stage.focus({preventScroll:true});
 const p=localPoint(e),r=Math.hypot(p.x-146,p.y-290);
 if(r>37&&r<80&&e.target.closest('#wheel-area')){drag={id:e.pointerId,x:e.clientX,y:e.clientY,angle:Math.atan2(p.y-290,p.x-146),acc:0,moved:false,action:target?.dataset.action};stage.setPointerCapture(e.pointerId);if(['next','previous'].includes(drag.action))beginHold(drag.action,`pointer:${e.pointerId}`);e.preventDefault();}
 else if(target){action(target.dataset.action);e.preventDefault();}
});
stage.addEventListener('pointermove',e=>{
 if(!drag||e.pointerId!==drag.id)return;
 const p=localPoint(e);if(Math.hypot(p.x-146,p.y-290)<38){drag.angle=null;return;}const a=Math.atan2(p.y-290,p.x-146);if(drag.angle===null){drag.angle=a;return;}let d=a-drag.angle;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;drag.angle=a;
 if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>5){drag.moved=true;releaseHold(true,`pointer:${drag.id}`);wheelArea.classList.add('dragging');}
 if(!drag.moved)return;drag.acc+=d;const dot=$('wheel-dot');dot.style.opacity='.65';dot.setAttribute('cx',146+Math.cos(a)*70);dot.setAttribute('cy',290+Math.sin(a)*70);
 while(Math.abs(drag.acc)>.22){const dir=Math.sign(drag.acc);rotate(dir);drag.acc-=dir*.22;}
});
function endDrag(cancel=false){if(drag){const d=drag;drag=null;if(stage.hasPointerCapture(d.id))stage.releasePointerCapture(d.id);if(!d.moved&&!cancel){if(state.hold?.owner===`pointer:${d.id}`)releaseHold(false,`pointer:${d.id}`);else if(d.action)action(d.action);}else releaseHold(true,`pointer:${d.id}`);}wheelArea.classList.remove('dragging');$('wheel-dot').style.opacity='0';}
stage.addEventListener('pointerup',e=>{if(drag?.id===e.pointerId)endDrag();});stage.addEventListener('pointercancel',e=>{if(drag?.id===e.pointerId)endDrag(true);});
let wheelAcc=0,lastWheel=0;
stage.addEventListener('wheel',e=>{
 if(state.inspect||e.ctrlKey||!e.target.closest('#device'))return;e.preventDefault();const now=Date.now();if(now-lastWheel>160)wheelAcc=0;lastWheel=now;
 let d=Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX;d*=e.deltaMode===1?16:e.deltaMode===2?200:1;if(wheelAcc*d<0)wheelAcc=0;wheelAcc+=d;
 let n=0;while(Math.abs(wheelAcc)>=24&&n++<6){const dir=Math.sign(wheelAcc);rotate(dir);wheelAcc-=dir*24;}
},{passive:false});
const keymap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'back',ArrowRight:'select',Enter:'select',Escape:'menu',Backspace:'back',w:'menu',a:'previous',s:'play',d:'next',v:'view',i:'inspect',' ':'play'};
const keycaps=new Map([...document.querySelectorAll('button[data-action]')].map(button=>[button.dataset.action,button]));
const pressedKeys=new Map(),pressedKeycaps=new Map();
const keyboardKey=e=>e.key.length===1?e.key.toLowerCase():e.key;
function pressKeycap(key,a){
 const button=keycaps.get(a);if(!button||button.disabled||pressedKeys.has(key))return;
 let press=pressedKeycaps.get(a);
 if(!press){press={button,keys:new Set(),started:0,timer:0};pressedKeycaps.set(a,press);}
 clearTimeout(press.timer);press.timer=0;
 if(!press.keys.size)press.started=Date.now();
 press.keys.add(key);pressedKeys.set(key,a);button.classList.add('is-pressed');
}
function releaseKeycap(key){
 const a=pressedKeys.get(key);if(!a)return;pressedKeys.delete(key);
 const press=pressedKeycaps.get(a);if(!press)return;
 press.keys.delete(key);if(press.keys.size)return;
 const release=()=>{press.button.classList.remove('is-pressed');pressedKeycaps.delete(a);};
 // Very short taps need a visible pressed state; held keys release immediately.
 const remaining=80-(Date.now()-press.started);
 if(remaining>0)press.timer=setTimeout(release,remaining);else release();
}
function clearKeycaps(){
 pressedKeycaps.forEach(press=>{clearTimeout(press.timer);press.button.classList.remove('is-pressed');});
 pressedKeycaps.clear();pressedKeys.clear();
}
window.addEventListener('keydown',e=>{
 if(e.metaKey||e.ctrlKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;
 const key=keyboardKey(e),a=keymap[key];
 const focusedButton=e.target.closest('button');
 if((e.key==='Enter'||e.key===' ')&&focusedButton){pressKeycap(key,focusedButton.dataset.action);return;}
 if(state.inspect){if(a==='play')pressKeycap(key,a);if(inspectionKey(e))e.preventDefault();return;}
 if(!a)return;e.preventDefault();pressKeycap(key,a);
 if(a==='next'||a==='previous'){if(!e.repeat)beginHold(a,`key:${e.key.toLowerCase()}`);return;}if(e.repeat&&!['up','down'].includes(a))return;action(a);
});
window.addEventListener('keyup',e=>{const key=keyboardKey(e);releaseKeycap(key);if(['next','previous'].includes(keymap[key]))releaseHold(false,`key:${key}`);});
window.addEventListener('blur',()=>{clearKeycaps();framePress=null;endDrag(true);releaseHold(true);stopInspectionDrag();cancelInspectionReturn();stage.querySelectorAll('.down').forEach(el=>el.classList.remove('down'));});
window.addEventListener('pagehide',()=>{clearKeycaps();releaseHold(true);});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearKeycaps();releaseHold(true);}});
document.querySelectorAll('button[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));
$('theme').addEventListener('click',()=>{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';$('theme').querySelector('span').textContent=light?'Light':'Dark';$('theme').setAttribute('aria-label',`Switch to ${light?'dark':'light'} theme`);});
setInterval(()=>{if(state.playing&&window.NanoAudio){state.position=NanoAudio.getPosition();if(state.position>=tracks[state.track].duration){if(state.repeat||state.shuffle||state.track<tracks.length-1)changeTrack(1);else setPlaying(false);}}if(state.playing||state.overlay>Date.now()-400)render();},250);
render();
</script>
